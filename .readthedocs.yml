# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # install the locked docs dependencies with uv into the environment read the docs
    # created for us and runs sphinx in
    install:
      - pip install uv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --frozen --group docs --no-default-groups

# Build documentation in the docs/source/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py
