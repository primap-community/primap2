[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "primap2"
version = "0.13.0"
description = "The next generation of the PRIMAP climate policy analysis suite."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.13"
authors = [
    { name = "Mika Pflüger", email = "mika.pflueger@climate-resource.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "attrs>=23",
    "xarray==2025.8.0",
    "numbagg>=0.8.1",
    "pint>=0.24.4",
    "pint_xarray>=0.4, <0.6",
    "numpy>=1.26,<2",
    "pandas>=2.2.2",
    "openscm_units>=0.6",
    "loguru>=0.7",
    "scipy>=1.13.0",
    "h5netcdf>=1",
    "h5py>=3.10.0",
    "matplotlib>=3.7",
    "ruamel.yaml>=0.18",
    "strictyaml>=1.7.3",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    "msgpack>=1",
    "climate_categories>=0.10.2",
]

[project.urls]
Homepage = "https://github.com/primap-community/primap2"
Documentation = "https://primap2.readthedocs.io/"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=4",
    "xdoctest>=1.2",
]
datalad = [
    "datalad>=1.1",
]

# Development tooling. Dependency groups are never published to PyPI, they are only
# used locally and in CI, so `uv sync` installs them by default.
[dependency-groups]
docs = [
    # sphinx is pinned below 8.1.3 because newer versions break our documentation build
    "Sphinx>=6,<8.1.3",
    "myst-nb>=1",
    "sphinx-book-theme>=1.1",
    "sphinx-favicon>=1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autosummary-accessors>=2023.4",
    "sphinx-tippy>=0.4.3",
    "numpydoc>=1.6",
    "jupytext>=1.16",
]
dev = [
    { include-group = "docs" },
    "primap2[test]",
    "tbump>=6.11",
    "towncrier>=23.6.0",
    "coverage>=7.4",
    "pre-commit>=3.6",
    "mypy>=1.11",
    "ruff>=0.6.3",
    "ruff-lsp>=0.0.50",
    "twine>=5",
    "ipykernel>=6.27.1",
    "jupyter>=1.1",
]

[tool.setuptools.packages.find]
include = ["primap2*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.csv", "*.nc"]

[tool.ruff]
extend-include = ["*.ipynb"]
extend-exclude = [
  "climate_categories/data/*.py",
  "climate_categories/tests/data/*.py",
  "docs-old/",
  "docs/*"
]
line-length = 100
lint.extend-select = [ "E", "W", "I", "UP", "B", "YTT", "A", "NPY", "RUF", "FURB", "FLY", "PYI" ]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["primap2"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
# actually, importlib.resources.open_text will be undeprecated again in python 3.13
filterwarnings = "ignore:.*open_text is deprecated.*:DeprecationWarning"

[tool.towncrier]
package = "primap2"
package_dir = "primap2"
filename = "docs/source/changelog.md"
directory = "changelog/"
title_format = "## primap2 {version} ({project_date})"
underlines = ["", "", ""]
issue_format = "[#{issue}](https://github.com/primap-community/primap2/pull/{issue})"

  [[tool.towncrier.type]]
  directory = "breaking"
  name = "Breaking Changes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "deprecation"
  name = "Deprecations"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "feature"
  name = "Features"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "improvement"
  name = "Improvements"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "fix"
  name = "Bug Fixes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "docs"
  name = "Improved Documentation"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "trivial"
  name = "Trivial/Internal Changes"
  showcontent = false
